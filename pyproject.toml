[tool.pytest.ini_options]
pythonpath = ["onvif"]
log_cli="true"
log_level="NOTSET"
plugins = ["covdefaults"]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "B", # flake8-bugbear
  "DTZ", # flake8-datetimez
  "EM", # flake8-errmsg
  "I", # isort
  "RUF", # ruff-specific
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "TC", # flake8-type-checking
]
ignore = [
  # Re-enable once the rules these noqa directives reference (A, F841) are
  # selected; until then RUF100 would force deleting noqa comments we'll need
  # back.
  "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # asserts in tests
  "S105", # hardcoded password strings
  "S106", # hardcoded passwords passed as args
]

[build-system]
requires = ['setuptools>=65.4.1', 'wheel']
