[tool.pytest.ini_options]
pythonpath = ["onvif"]
log_cli="true"
log_level="NOTSET"
plugins = ["covdefaults"]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "DTZ", # flake8-datetimez
  "EM", # flake8-errmsg
  "G", # flake8-logging-format
  "I", # isort
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PL", # pylint
  "PYI", # flake8-pyi
  "RET", # flake8-return
  "RUF", # ruff-specific
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "TC", # flake8-type-checking
  "TRY", # tryceratops
  "UP", # pyupgrade
]
ignore = [
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic value used in comparison
  "PLW2901", # loop variable overwritten
  "TRY003", # long messages outside exception class
  # Re-enable once the rules these noqa directives reference (A, F841) are
  # selected; until then RUF100 would force deleting noqa comments we'll need
  # back.
  "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # asserts in tests
  "S105", # hardcoded password strings
  "S106", # hardcoded passwords passed as args
]
"examples/**" = [
  "T20", # example scripts legitimately print to the console
]

[build-system]
requires = ['setuptools>=65.4.1', 'wheel']
