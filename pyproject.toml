[tool.pytest.ini_options]
pythonpath = ["onvif"]
log_cli="true"
log_level="NOTSET"
plugins = ["covdefaults"]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "A", # flake8-builtins
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4", # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "EM", # flake8-errmsg
  "ERA", # eradicate
  "EXE", # flake8-executable
  "FA", # flake8-future-annotations
  "FIX", # flake8-fixme
  "FLY", # flynt
  "FURB", # refurb
  "G", # flake8-logging-format
  "I", # isort
  "ICN", # flake8-import-conventions
  "INP", # flake8-no-pep420
  "ISC", # flake8-implicit-str-concat
  "LOG", # flake8-logging
  "N", # pep8-naming
  "NPY", # numpy-specific
  "PERF", # Perflint
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL", # pylint
  "PT", # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "Q", # flake8-quotes
  "RET", # flake8-return
  "RUF", # ruff-specific
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "SLOT", # flake8-slots
  "T10", # flake8-debugger
  "T20", # flake8-print
  "TC", # flake8-type-checking
  "TD", # flake8-todos
  "TID", # flake8-tidy-imports
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle warnings
  "YTT", # flake8-2020
]
ignore = [
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic value used in comparison
  "PLW2901", # loop variable overwritten
  "TRY003", # long messages outside exception class
  # Re-enable once the rules these noqa directives reference (A, F841) are
  # selected; until then RUF100 would force deleting noqa comments we'll need
  # back.
  "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "INP", # tests directory is intentionally not a package
  "S101", # asserts in tests
  "S105", # hardcoded password strings
  "S106", # hardcoded passwords passed as args
]
"examples/**" = [
  "INP", # examples directory is intentionally not a package
  "T20", # example scripts legitimately print to the console
]
"docs/**" = [
  "INP", # docs directory is intentionally not a package
]

[build-system]
requires = ['setuptools>=82.0.1', 'wheel']
